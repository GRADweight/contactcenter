[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gradweight-contactcenter"
version = "2.1.0"
description = "Sprachagent und Kapazitätsrechner für den Schweizer KMU-Kundendienst: Genesys Audio Connector, Erlang-C, GPU-Dimensionierung, Leitplanken"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GRADweight GmbH", email = "mail@gradweight.ch" }]
keywords = ["contact-center", "voicebot", "erlang-c", "genesys", "audiohook", "queueing", "vllm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []  # Kern: nur Standardbibliothek

[project.optional-dependencies]
server = ["websockets>=13"]
silero = ["onnxruntime>=1.18", "numpy>=1.26"]
dev = [
    "build>=1.2",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6",
    "ruff>=0.6",
    "websockets>=13",
]

[project.scripts]
gw-contactcenter = "gw_contactcenter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gw_contactcenter"]

[tool.hatch.build.targets.sdist]
include = [
    "gw_contactcenter",
    "tests",
    "evals",
    "beispiele",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "BLE", "C4", "PIE", "PT", "T20"]
ignore = [
    "RUF001", # mehrdeutige Unicode-Zeichen: deutsche Typografie (« », –, ×) ist gewollt
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310", "T20", "BLE001", "PT011", "PT018"]
"evals/**" = ["T20", "S101"]
"beispiele/**" = ["T20", "S101"]
"gw_contactcenter/cli.py" = ["T20"]
"gw_contactcenter/latenzmessung.py" = ["T20"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["gw_contactcenter"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["langsam: längere Simulationen (laufen trotzdem in CI)"]

[tool.coverage.run]
source = ["gw_contactcenter"]
branch = true
# Optionaler Adapter, braucht onnxruntime und eine Modelldatei.
omit = ["gw_contactcenter/adapters/silero.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "\\.\\.\\."]
