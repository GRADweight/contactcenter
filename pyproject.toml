[project]
name = "contactcenter-voiceagent"
version = "2.0.0"
description = "Echtzeit-Sprachagent für den Schweizer KMU-Kundendienst (Genesys AudioHook, lokale Modelle, Leitplanken)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "GRADweight GmbH" }]
dependencies = []          # Kern: nur Standardbibliothek

[project.optional-dependencies]
server = ["websockets>=13"]
silero = ["onnxruntime>=1.18", "numpy>=1.26"]

[project.scripts]
voiceagent-server = "voiceagent.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voiceagent*"]
