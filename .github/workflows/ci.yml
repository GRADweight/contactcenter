name: ci

# Prüft bei jedem Push und Pull Request: Lint und Typen, Tests unter drei
# Python-Versionen mit Abdeckung, Eval-Gate, Beispiele, Paket in frischer
# Umgebung, Container-Build und Sicherheit (Geheimnisse, Abhängigkeiten).
# Alles offline gegen Mocks und lokale Fake-Server: keine GPU, keine Schlüssel.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv venv && uv pip install -e ".[dev]"
      - name: ruff check
        run: .venv/bin/ruff check .
      - name: ruff format
        run: .venv/bin/ruff format --check .
      - name: mypy --strict
        run: .venv/bin/mypy

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv venv -p ${{ matrix.python }} && uv pip install -e ".[dev]"
      - name: pytest mit Abdeckung (Schwelle in pyproject.toml)
        run: .venv/bin/python -m pytest --cov --cov-report=term

  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv venv && uv pip install .
      - name: Golden-Set mit Gate
        run: .venv/bin/python evals/run_evals.py --json eval-bericht.json

  beispiele:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv venv && uv pip install .
      - name: Selbsttests der Beispiele
        run: |
          for b in beispiele/*.py; do .venv/bin/python "$b" selftest; done
      - name: Kommandozeile
        run: |
          .venv/bin/gw-contactcenter kapazitaet --anrufe-pro-tag 200
          .venv/bin/gw-contactcenter gpu --modell qwen3-8b --gespraeche 10
          .venv/bin/gw-contactcenter vergleich
          .venv/bin/gw-contactcenter sim

  paket:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Wheel und sdist bauen
        run: uv build
      - name: In frischer Umgebung installieren und prüfen
        run: |
          python -m venv /tmp/frisch
          /tmp/frisch/bin/pip install dist/*.whl
          cd /tmp
          /tmp/frisch/bin/python -c "import gw_contactcenter, importlib.resources as r; assert r.files('gw_contactcenter').joinpath('py.typed').is_file(); print(gw_contactcenter.__version__)"
          /tmp/frisch/bin/gw-contactcenter --version
          /tmp/frisch/bin/gw-contactcenter kapazitaet --anrufe-pro-tag 200 | grep -q "Ergebnis: 4 Agenten"
          /tmp/frisch/bin/python -m gw_contactcenter sim | grep -q "SIMULATION"
          if /tmp/frisch/bin/gw-contactcenter server 2>/tmp/fehler.txt; then exit 1; fi
          grep -q "verweigert" /tmp/fehler.txt
      - name: Tests aus dem sdist (enthält alles, was die Tests brauchen)
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          uv venv -p 3.13 /tmp/sdist-venv
          uv pip install -p /tmp/sdist-venv "/tmp/sdist[dev]"
          cd /tmp/sdist && /tmp/sdist-venv/bin/python -m pytest -q -p no:cacheprovider

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose-Datei prüfen (mit Platzhaltern für Pflichtwerte)
        env:
          DOMAIN: voice.example.ch
          AUDIOHOOK_API_KEY: platzhalter
          AUDIOHOOK_CLIENT_SECRET: platzhalter
          AUDIT_HMAC_KEY: platzhalter-platzhalter-platzhalter-32
          LLM_MODELL: Qwen/Qwen3-8B-AWQ
          ASR_MODELL: Systran/faster-whisper-large-v3
          TTS_MODELL: piper-de
          TTS_STIMME: de
          GRAFANA_ADMIN_PASSWORD: platzhalter
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Images bauen
        run: |
          docker build -f deploy/Dockerfile -t gw-contactcenter:ci .
          docker build -f deploy/Caddy.Dockerfile -t gw-caddy:ci deploy
      - name: Container läuft nicht als root und verweigert unsicheren Start
        run: |
          test "$(docker run --rm gw-contactcenter:ci id -u)" = "10001"
          docker run --rm gw-contactcenter:ci gw-contactcenter --version
          if docker run --rm gw-contactcenter:ci; then exit 1; fi

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (Binary mit Prüfsumme)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
          ./gitleaks dir --redact --no-banner .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: pip-audit gegen die installierten Abhängigkeiten
        run: |
          uv venv -p 3.13 .audit
          uv pip install -p .audit ".[server,dev]"
          uvx pip-audit --path .audit/lib/python3.13/site-packages
