name: ci

# CI-Gate für contactcenter: hartes Gate (grün/rot) über alle lauffähigen
# Teile. Drei Schichten:
#   1) Syntax/Import  - alle .py compilen (schnell)
#   2) Verhalten       - Samples (selftest), voiceagent-Tests, simulierter Anruf
#   3) Qualität        - Evals gegen Golden-Set mit harten Schwellen
#
# Keine GPU, keine API-Keys, kein externes Netz - alles deterministisch.
# Einzige Installation: websockets (für den WebSocket-Servertest).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-behavior:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 1) Alle .py compilen (Syntax + Import-Fehler)
        run: |
          python -m py_compile \
            beispiele/transkript_pipeline.py \
            beispiele/skalierungsrechner.py \
            beispiele/handoff_router.py \
            beispiele/qualitaetstest.py
          python -m compileall -q voiceagent evals tests
          echo "  Alle Python-Dateien compilen"

      - name: 2) Selftests (kein Netz, kein API-Key)
        run: |
          echo "  - transkript_pipeline selftest -"
          python beispiele/transkript_pipeline.py selftest
          echo "  - skalierungsrechner selftest -"
          python beispiele/skalierungsrechner.py selftest
          echo "  - handoff_router selftest -"
          python beispiele/handoff_router.py selftest

      - name: '3) Qualitäts-Suite Q1-Q4 (Routing/Absicht/Skalierung/Sicherheit)'
        run: |
          python beispiele/qualitaetstest.py
          # exit-Code 1 bei rotem Test bricht das Gate

      - name: '4) Skalierungsrechner Demo-Szenario 200 Tag 10 zugleich'
        run: |
          python beispiele/skalierungsrechner.py rechner 200 10
          echo '  Günstigste passende Karte (L4), keine überdimensionierte A100:'
          python beispiele/skalierungsrechner.py rechner 200 10 | grep -q "1x L4-24"

      - name: '5) voiceagent - Unit-, Integrations- und End-to-End-Tests'
        run: |
          pip install "websockets>=13"
          python -m unittest discover -s tests -v

      - name: '6) Evals - Golden-Set mit Gate (Sicherheit 100 %, Übergabe >= 95 %, Latenz)'
        run: python evals/run_evals.py --json eval-bericht.json

      - name: '7) Simulierter Anruf und GPU-Dimensionierung'
        run: |
          python -m voiceagent.sim
          python -m voiceagent.sizing qwen3-8b 10

      - name: '8) Doku-Linkcheck (keine toten Links in den Dossiers)'
        run: |
          python - <<'PY'
          import os, re, glob
          missing = []
          for doc in glob.glob('docs/*.md'):
              s = open(doc, encoding='utf-8').read()
              for link in re.findall(r'\]\(([^)]+)\)', s):
                  target = link.split('#')[0]
                  if not target or target.startswith('http'):
                      continue
                  full = os.path.join(os.path.dirname(doc), target)
                  if not os.path.exists(full):
                      missing.append((doc, link))
          print('  geprüfte Dossiers:', len(glob.glob('docs/*.md')))
          assert not missing, f'tote Links: {missing}'
          print('  keine toten Doku-Links')
          PY
